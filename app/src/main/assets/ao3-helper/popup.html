<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 220px;
      padding: 14px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ddd;
      border-radius: 999px;
      transition: .2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }

    input:checked + .slider {
      background: #13c763;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .hint {
      margin-top: 10px;
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="row">
    <strong>页面翻译</strong>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="hint">关闭后，页面将恢复为AO3原文。</div>

  <script src="popup.js"></script>
</body>
</html>
