name: Build AO3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - ao3-browser-customization

jobs:
  build-apk:
    name: Build AO3 Browser APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Patch Android Components
        run: ./automation/iceraven/patch_android_components.sh

      - name: Build forkRelease APKs
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble forkRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: List APK outputs
        run: ls -alh gradle/build/app/outputs/apk/forkRelease/ app/build/outputs/apk/forkRelease/ || true

      - name: Sign APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-apks
          keytool -genkeypair \
            -keystore ao3-browser-release.jks \
            -storepass android \
            -keypass android \
            -alias ao3-browser \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AO3 Browser,O=AO3 Browser,C=US"

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          shopt -s nullglob
          for apk in gradle/build/app/outputs/apk/forkRelease/*.apk app/build/outputs/apk/forkRelease/*.apk; do
            base="$(basename "$apk" .apk)"
            aligned="signed-apks/${base}-aligned.apk"
            signed="signed-apks/${base/-unsigned/}-signed.apk"
            "$ZIPALIGN" -p -f 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks ao3-browser-release.jks \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$signed" \
              "$aligned"
            "$APKSIGNER" verify --verbose "$signed"
            rm "$aligned"
          done

          ls -alh signed-apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ao3-browser-apks
          path: signed-apks/*.apk
          if-no-files-found: error
