name: Build AO3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - ao3-browser-customization

jobs:
  build-apk:
    name: Build AO3 Browser APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Create version name
        run: echo "VERSION_NAME=ao3-browser-$(TZ=UTC date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Patch Android Components
        run: ./automation/iceraven/patch_android_components.sh

      - name: Build forkRelease APKs
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble forkRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: List APK outputs
        run: ls -alh gradle/build/app/outputs/apk/forkRelease/ app/build/outputs/apk/forkRelease/ || true

      - name: Sign APKs
        shell: bash
        env:
          AO3_RELEASE_KEYSTORE_BASE64: ${{ secrets.AO3_RELEASE_KEYSTORE_BASE64 }}
          AO3_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AO3_RELEASE_KEYSTORE_PASSWORD }}
          AO3_RELEASE_KEY_ALIAS: ${{ secrets.AO3_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p signed-apks
          if [ -z "${AO3_RELEASE_KEYSTORE_BASE64:-}" ] || \
             [ -z "${AO3_RELEASE_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${AO3_RELEASE_KEY_ALIAS:-}" ]; then
            echo "AO3 release signing secrets are not configured." >&2
            exit 1
          fi

          printf '%s' "$AO3_RELEASE_KEYSTORE_BASE64" | base64 --decode > ao3-browser-release.jks

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          shopt -s nullglob
          for apk in gradle/build/app/outputs/apk/forkRelease/*.apk app/build/outputs/apk/forkRelease/*.apk; do
            base="$(basename "$apk" .apk)"
            aligned="signed-apks/${base}-aligned.apk"
            signed="signed-apks/${base/-unsigned/}-signed.apk"
            "$ZIPALIGN" -p -f 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks ao3-browser-release.jks \
              --ks-pass "pass:$AO3_RELEASE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$AO3_RELEASE_KEY_ALIAS" \
              --key-pass "pass:$AO3_RELEASE_KEYSTORE_PASSWORD" \
              --out "$signed" \
              "$aligned"
            "$APKSIGNER" verify --verbose "$signed"
            rm "$aligned"
          done

          ls -alh signed-apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ao3-browser-apks
          path: signed-apks/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: AO3 Browser ${{ env.VERSION_NAME }}
          target_commitish: ao3-browser-customization
          prerelease: true
          files: signed-apks/*.apk
          body: |
            AO3 Browser custom build.

            Includes:
            - AO3-focused browser behavior
            - DoH enabled with the configured Cloudflare Gateway endpoint
            - First-run local setup guide for AO3 Chinese
            - Built-in AO3 Chinese translation extension without Tampermonkey
