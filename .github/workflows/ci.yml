name: CI

on:
  push:
    branches:
      - iceraven
  workflow_dispatch: {}

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/android-sdk-linux
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('automation/iceraven/install-sdk.sh') }}

      - name: Restore Glean parser cache
        uses: actions/cache@v4
        with:
          path: .gradle/glean-parser-venv
          key: ${{ runner.os }}-glean-parser-20.0.0

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Install Glean parser
        run: |
          python3 -m venv .gradle/glean-parser-venv
          .gradle/glean-parser-venv/bin/python -m pip install --disable-pip-version-check 'glean_parser==20.0.0'

      - name: Prepare android-components catalog paths
        run: ./automation/iceraven/prepare_android_components_catalog.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags --always HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh

      - name: Relpace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Restore debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build forkRelease variant of app
        env:
          # Try to stop the daemon from magically vanishing by adding random memory-related arguments.
          # See <https://stackoverflow.com/a/70010526> and <https://stackoverflow.com/a/70756876>
          # The runner seems to have ~6 gigs of memory, so we make sure to stay under that.
          # We have Java 11 so we don't have a perm size anymore.
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkRelease -PonlyArm64 -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Locate arm64 apk
        run: |
          apk=$(find app/build/outputs/apk/forkRelease -type f -name 'app-arm64-v8a-forkRelease.apk' -print -quit)
          test -n "$apk"
          echo "ARM64_APK=$apk" >> "$GITHUB_ENV"
          ls -alh "$apk"

      - name: Upload arm64 apk
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ARM64_APK }}
          name: ${{ env.VERSION_NAME }}-browser-arm64-v8a-forkRelease.apk
