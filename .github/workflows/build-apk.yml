name: Build Iceraven Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: 34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingConfigStore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_signingConfigAlias: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingConfigKeyAlias: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingConfigKeyPassword: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingConfigStorePassword: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: iceraven-debug-apk
          path: app/build/outputs/apk/debug/*.apk