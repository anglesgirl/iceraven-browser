name: Build Iceraven Android APK

on:
  push:
    branches: [master, main, iceraven]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone llama.cpp (Tencent STQ kernel, PR #19357) for HyMT
        run: |
          mkdir -p app/src/main/cpp
          cd app/src/main/cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git fetch origin pull/19357/head && git checkout FETCH_HEAD
          echo "llama.cpp STQ kernel ready: $(git rev-parse --short HEAD)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch android-components paths (official upstream fix)
        run: bash automation/iceraven/patch_android_components.sh

      - name: Setup Glean parser venv
        run: |
          python3 -m venv gradle/glean-parser-venv
          gradle/glean-parser-venv/bin/pip install --upgrade pip
          gradle/glean-parser-venv/bin/pip install "glean_parser~=19.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build forkRelease APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx7g -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.lang.ref=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
        run: ./gradlew assembleForkRelease --no-daemon --stacktrace

      - name: Locate APK
        run: find gradle/build -name "*.apk" -type f 2>/dev/null

      - name: Sign APKs with debug key
        run: |
          set -e
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -1)
          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/$BT/zipalign
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/$BT/apksigner
          for apk in $(find gradle/build -name "*-unsigned.apk"); do
            signed="${apk%-unsigned.apk}.apk"
            echo "Signing $apk -> $signed"
            $ZIPALIGN -f 4 "$apk" "$signed"
            $APKSIGNER sign --ks ~/.android/debug.keystore \
              --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
              "$signed"
            rm "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-forkRelease-apk
          path: gradle/build/app/outputs/apk/forkRelease/
