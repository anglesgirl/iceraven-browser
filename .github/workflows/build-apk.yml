name: Build Iceraven Android APK

on:
  push:
    branches: [master, main, iceraven]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          ndk-version: r27b
          build-tools-version: 36.0.0

      - name: Patch android-components paths (official upstream fix)
        run: bash automation/iceraven/patch_android_components.sh

      - name: Setup Glean parser venv
        run: |
          python3 -m venv gradle/glean-parser-venv
          gradle/glean-parser-venv/bin/pip install --upgrade pip
          gradle/glean-parser-venv/bin/pip install "glean_parser~=19.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build forkRelease APK
        run: ./gradlew assembleForkRelease --no-daemon

      - name: Locate APK
        run: find app/build -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-forkRelease-apk
          path: app/build/outputs/apk/forkRelease/
