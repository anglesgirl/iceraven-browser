name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # android-components 是 submodule
          fetch-depth: 1

      - name: Fix android-components version catalog path
        run: |
          # ac 插件用 ../../../../../gradle/libs.versions.toml（假定平级布局），
          # 嵌套在 Iceraven 里会指到 $GITHUB_WORKSPACE/../../gradle —— 建软链
          ln -s "$GITHUB_WORKSPACE/gradle" "$GITHUB_WORKSPACE/../../gradle"
          ls -la "$GITHUB_WORKSPACE/../../gradle"

      - name: Inject DoH certs
        run: |
          echo "${{ secrets.DOH_CERT_PEM }}" > app/src/main/assets/doh-fullchain.pem
          echo "${{ secrets.DOH_KEY_PEM }}" > app/src/main/assets/doh-key.pem
          openssl x509 -in app/src/main/assets/doh-fullchain.pem -noout -subject -dates

      - name: Build NSS cert db (trust CA, 免安装)
        run: |
          sudo apt-get install -y libnss3-tools >/dev/null 2>&1
          mkdir -p /tmp/nssprofile
          certutil -N -d sql:/tmp/nssprofile --empty-password
          # 提取 CA（fullchain 第一张 = 叶子，第二张 = CA）
          awk '/BEGIN CERTIFICATE/{n++} n==2' app/src/main/assets/doh-fullchain.pem > /tmp/ca.pem
          certutil -A -d sql:/tmp/nssprofile -n "echdoh-local-CA" -t "C,," -i /tmp/ca.pem
          certutil -L -d sql:/tmp/nssprofile
          cp /tmp/nssprofile/cert9.db /tmp/nssprofile/key4.db /tmp/nssprofile/pkcs11.txt app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Build debug APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g'
        run: |
          # glean 插件需要预建 python venv（glean_parser 生成 metrics 源码，要求 ~=19.0）
          python3 -m venv build/glean_venv
          build/glean_venv/bin/pip install -q "glean_parser~=19.0" 2>&1 | tail -1 || true
          # Iceraven 特有：crashreporter 源码生成（Annotation.JavaException 等）
          python3 -m pip install -q pyyaml 2>&1 | tail -1 || true
          python3 automation/iceraven/toolkit/crashreporter/generate_crash_reporter_sources.py && echo "crashreporter OK"
          # publicsuffixlist 插件需要 effective_tld_names.dat（mozilla 构建生成文件）
          mkdir -p netwerk/dns
          curl -sL https://publicsuffix.org/list/effective_tld_names.dat -o netwerk/dns/effective_tld_names.dat
          head -3 netwerk/dns/effective_tld_names.dat
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-echdoh-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
